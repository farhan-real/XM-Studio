<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Deep Analog Chassis -->
  <rect width="100" height="100" rx="22" fill="#080b09"/>
  
  <!-- Inset Faceplate Bezel -->
  <rect x="7" y="7" width="86" height="86" rx="16" fill="#0e1411" stroke="#1a2820" stroke-width="1.5"/>

  <!-- Analog Reel / Lathe-Turned Outer Track -->
  <circle cx="50" cy="50" r="33" fill="#080b09" stroke="#193324" stroke-width="1.5"/>
  
  <!-- Precision Inner Tape Groove -->
  <circle cx="50" cy="50" r="27" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  
  <!-- Minimalist Radial Hub Pips (120° Spacing) -->
  <circle cx="50" cy="25" r="1.75" fill="#22c55e" opacity="0.75"/>
  <circle cx="28" cy="62" r="1.75" fill="#22c55e" opacity="0.75"/>
  <circle cx="72" cy="62" r="1.75" fill="#22c55e" opacity="0.75"/>

  <!-- Bold Minimalist Playhead (Phosphor Green) -->
  <polygon points="43,36 67,50 43,64" fill="#22c55e"/>

  <!-- Analog Power / Status Lamp -->
  <circle cx="50" cy="83" r="2.25" fill="#4ade80"/>
</svg>